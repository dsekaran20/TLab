<html lang="en">
<head>

  <title>TLab</title>
  <style>
    body {

      margin: 0 auto;

      color: #20211f;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;

    h1 {

      font-size: clamp(2.2rem, 7vw, 4.5rem);

      margin-top: 6px;
      color: #68665f;
      font-size: 1.15rem;

  <main>
    <h1>Tamil Lab</h1>
    <p class="subtitle">

      <p>
        An interactive chronology of selected Tamil texts, authors, places,
